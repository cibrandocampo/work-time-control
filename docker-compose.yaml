services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wtc}
      POSTGRES_USER: ${POSTGRES_USER:-wtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wtc_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/src:/app/src
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-wtc}:${POSTGRES_PASSWORD:-wtc_dev_password}@db:5432/${POSTGRES_DB:-wtc}
      - EXTERNAL_TIME_MANAGER_URL=${EXTERNAL_TIME_MANAGER_URL:-}
    depends_on:
      - db
    stdin_open: true
    tty: true

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
